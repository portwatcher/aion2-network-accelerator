[workspace]
members = ["crates/aion2-common", "crates/aion2-relay", "crates/aion2-proxy", "crates/aion2-app"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
chacha20poly1305 = "0.10"
rand = "0.8"
anyhow = "1"
bytes = "1"
